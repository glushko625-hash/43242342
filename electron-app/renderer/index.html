<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contextual Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Contextual Notes</h1>
      <div class="status" id="status"></div>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <button id="create-note" class="primary">Новая заметка</button>
        </div>
        <ul id="notes-list"></ul>
      </aside>
      <section class="editor">
        <div class="editor-toolbar">
          <input id="note-title" placeholder="Название заметки" />
          <div class="ai-controls">
            <input id="ai-prompt" placeholder="Инструкция для ИИ (например, \"перефразируй\")" />
            <button id="run-ai" class="secondary">Изменить выделенный текст</button>
          </div>
        </div>
        <textarea id="note-body" placeholder="Начните писать..."></textarea>
        <section class="ai-output" id="ai-output" hidden>
          <header>
            <h2>Предложение ИИ</h2>
            <span id="ai-provider"></span>
          </header>
          <pre id="ai-content"></pre>
          <div class="ai-actions">
            <button id="apply-ai" class="primary">Применить</button>
            <button id="discard-ai" class="secondary">Скрыть</button>
          </div>
        </section>
      </section>
      <aside class="preview" id="preview-pane">
        <h2>Быстрый просмотр</h2>
        <article id="preview-content"></article>
      </aside>
    </main>
    <footer class="app-footer">
      <p>Electron v<span id="electron-version"></span></p>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
